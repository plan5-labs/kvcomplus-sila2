[project]
name = "kvcomplus-sila2"
version = "0.1.0"
description = "SiLA2 server wrapping the KEYENCE KV COM+ Library (KV-DH1L) for KV series PLCs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kazunari Kaizu" }]
requires-python = ">=3.11"
dependencies = [
    "sila2[codegen]>=0.14.0",
    "typer",
    # The KV COM+ DBCommManager is a 32-bit COM component; it is loaded in a
    # 32-bit helper process and reached over RPC. msl-loadlib provides the
    # Client64/Server32 bridge (its bundled 32-bit server includes comtypes, so
    # pywin32 is not needed). The bundled server is Windows-only.
    "msl-loadlib>=0.10.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kvcomplus_sila2*"]

[tool.setuptools.package-data]
"kvcomplus_sila2.generated" = [
    "*/*.sila.xml",
    "*/*.proto",
]
